name: Build Unsigned IPA (archived iOS app)

# このワークフローは ios-app/ 配下(無料Apple IDでのSideloadly配布を前提に作った
# ネイティブiOS版)を変更したときだけ動く。現在アプリの主開発は web/ の PWA版に
# 移行しており、この native 版はアーカイブとして残しているだけなので普段は動かない。
# 再開する場合(例: 有料Apple Developer Programに加入して7日制限を解消するなど)は
# ios-app/README.md を参照。

on:
  push:
    branches: ["**"]
    paths:
      - "ios-app/**"
      - ".github/workflows/build-ios.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show selected Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, for iOS device)
        run: |
          set -euo pipefail
          xcodebuild clean build \
            -project ReadingTracker.xcodeproj \
            -scheme ReadingTracker \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package .ipa
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products -maxdepth 2 -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "::error::.app not found under build/Build/Products"
            exit 1
          fi
          echo "Packaging: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -y ReadingTracker.ipa Payload

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReadingTracker-unsigned-ipa
          path: ios-app/ReadingTracker.ipa
          retention-days: 14
