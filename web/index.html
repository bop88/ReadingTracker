<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>読書記録</title>
  <meta name="description" content="個人の読書記録を端末内だけで管理するPWA" />

  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#1a472a" />

  <!-- iOS: ホーム画面に追加したときの見た目 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="読書記録" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <div class="app-header">
      <h1 id="app-title">本棚</h1>
      <div id="app-header-actions"></div>
    </div>
    <main class="app-main" id="app-main"></main>
    <nav class="tab-bar" id="tab-bar">
      <button data-tab="shelf" class="active">
        <span class="icon">📚</span><span>本棚</span>
      </button>
      <button data-tab="stats">
        <span class="icon">📊</span><span>統計</span>
      </button>
      <button data-tab="trending">
        <span class="icon">🔥</span><span>話題の本</span>
      </button>
      <button data-tab="settings">
        <span class="icon">⚙️</span><span>設定</span>
      </button>
    </nav>
  </div>

  <div id="modal-root"></div>

  <!-- バーコードスキャン用ライブラリ(ZXing, Apache-2.0)をオフラインでも使えるようローカル同梱 -->
  <script src="vendor/zxing.min.js"></script>
  <script type="module" src="js/app.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js").catch((err) => {
          console.warn("Service worker registration failed:", err);
        });
      });

      // 新しいService Workerが有効化されてページの制御が切り替わったら、
      // 開きっぱなしのタブでも最新のJS/CSSが読み込まれるよう一度だけ再読み込みする。
      let hasReloadedForUpdate = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (hasReloadedForUpdate) return;
        hasReloadedForUpdate = true;
        window.location.reload();
      });
    }
  </script>
</body>
</html>
